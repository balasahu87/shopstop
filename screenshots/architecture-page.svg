<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900"><rect width="1440" height="900" fill="#f7f6f2"/><rect width="1440" height="76" fill="white"/><text x="70" y="48" font-family="Arial" font-size="24" font-weight="700">S  ShopStop AI</text><text x="90" y="145" font-family="Arial" font-size="11" fill="#888" letter-spacing="2">ENGINEERING CASE STUDY</text><text x="90" y="205" font-family="Arial" font-size="46" font-weight="700">Architecture that scales</text><text x="90" y="240" font-family="Arial" font-size="14" fill="#777">From a simple commerce experience to a distributed, observable multi-agent platform.</text><g font-family="Arial"><g transform="translate(90 300)"><rect width="290" height="190" rx="18" fill="white"/><text x="25" y="45" font-size="11" fill="#6d42ff">01</text><text x="25" y="85" font-size="20" font-weight="700">React experience</text><text x="25" y="120" font-size="13" fill="#777">Reusable components, page composition,</text><text x="25" y="142" font-size="13" fill="#777">responsive UX and API-driven state.</text></g><g transform="translate(410 300)"><rect width="290" height="190" rx="18" fill="white"/><text x="25" y="45" font-size="11" fill="#6d42ff">02</text><text x="25" y="85" font-size="20" font-weight="700">FastAPI domain layer</text><text x="25" y="120" font-size="13" fill="#777">Typed REST APIs, validation, cart/order</text><text x="25" y="142" font-size="13" fill="#777">workflows and OpenAPI documentation.</text></g><g transform="translate(730 300)"><rect width="290" height="190" rx="18" fill="white"/><text x="25" y="45" font-size="11" fill="#6d42ff">03</text><text x="25" y="85" font-size="20" font-weight="700">Agent orchestration</text><text x="25" y="120" font-size="13" fill="#777">Explicit contracts, trace IDs, deterministic</text><text x="25" y="142" font-size="13" fill="#777">execution and bounded tool permissions.</text></g><g transform="translate(1050 300)"><rect width="290" height="190" rx="18" fill="white"/><text x="25" y="45" font-size="11" fill="#6d42ff">04</text><text x="25" y="85" font-size="20" font-weight="700">Production evolution</text><text x="25" y="120" font-size="13" fill="#777">PostgreSQL, Redis, Kafka, OpenTelemetry,</text><text x="25" y="142" font-size="13" fill="#777">workers, identity and payment abstraction.</text></g></g><rect x="90" y="540" width="1250" height="250" rx="20" fill="#171719"/><text x="125" y="580" font-family="Arial" font-size="12" fill="#cfc5ff">SYSTEM FLOW</text><text x="125" y="625" font-family="monospace" font-size="15" fill="white">Customer → API Gateway → Commerce Services</text><text x="125" y="655" font-family="monospace" font-size="15" fill="#d8d0ff">                    ├── Catalog Service</text><text x="125" y="685" font-family="monospace" font-size="15" fill="#d8d0ff">                    ├── Cart Service → PostgreSQL / Redis</text><text x="125" y="715" font-family="monospace" font-size="15" fill="#d8d0ff">                    ├── Order Service → Event Bus</text><text x="125" y="745" font-family="monospace" font-size="15" fill="#d8d0ff">                    └── AI Orchestrator → Intent → Catalog → Pricing → Recommendation → Order</text></svg>